# electron-builder configuration for Nimbo.
# Build with:  npm run dist:mac   (produces an unsigned .dmg + .zip in release/)
appId: com.mindware.nimbo
productName: Nimbo
copyright: © 2026 Mindware (Xavier) — mindware.com.mx

directories:
  # Icons (icon.icns) live here; installers are written to release/.
  buildResources: build
  output: release

# electron-builder auto-includes package.json and production node_modules
# (ssh2, zod). We add the electron-vite build output explicitly.
files:
  - out/**/*
  - package.json

# ssh2 ships an optional native addon (cpu-features); keep any .node files
# outside the asar so they load correctly. Harmless if none are present.
asarUnpack:
  - "**/*.node"

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # Unsigned, personal-use build. Hardened runtime / notarization are skipped;
  # see the README notes for enabling Developer ID signing later.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  title: ${productName} ${version}
  # Standard drag-to-Applications layout.
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
