# electron-builder configuration for Nimbo.
# Build with:  npm run dist:mac   (produces a signed + notarized .dmg + .zip in release/)
#
# Signing requires a "Developer ID Application" cert in your login Keychain
# (auto-discovered). Notarization reads App Store Connect API-key credentials
# from the environment:
#   APPLE_API_KEY     = absolute path to the AuthKey_XXXX.p8 file
#   APPLE_API_KEY_ID  = the key's Key ID
#   APPLE_API_ISSUER  = the Issuer ID (UUID) from App Store Connect
appId: com.mindware.nimbo
productName: Nimbo
copyright: © 2026 Mindware (Xavier) — mindware.com.mx

directories:
  # Icons (icon.icns) live here; installers are written to release/.
  buildResources: build
  output: release

# electron-builder auto-includes package.json and production node_modules
# (ssh2, zod). We add the electron-vite build output explicitly.
files:
  - out/**/*
  - package.json

# ssh2 ships an optional native addon (cpu-features); keep any .node files
# outside the asar so they load correctly. Harmless if none are present.
asarUnpack:
  - "**/*.node"

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # Signed + notarized Developer ID build.
  # `identity` is omitted so electron-builder auto-discovers the installed
  # "Developer ID Application" certificate. Set CSC_IDENTITY_AUTO_DISCOVERY=false
  # to force an unsigned build for quick local testing.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true

dmg:
  title: ${productName} ${version}
  # Standard drag-to-Applications layout.
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
